plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

repositories {
    maven {
        url = "file://tmp/mymavenrepo/"
    }
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://minecraft.guntram.de/maven/"
    }
	maven {
		url = "https://maven.terraformersmc.com/releases/"
	}
    maven { url "https://maven.shedaniel.me/" }
}


sourceCompatibility = 21
targetCompatibility = 21



archivesBaseName = "easiercrafting-updated"

version = "${project.minecraft_version}-${project.projectVersion}"

loom {
        mixin.defaultRefmapName = "EasierCrafting-refmap.json";
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

dependencies {
    minecraft  "com.mojang:minecraft:${project.minecraft_version}"
    mappings   "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    modImplementation "de.guntram.mcmod:GBfabrictools:${project.gbfabrictools_version}"
    include    "de.guntram.mcmod:GBfabrictools:${project.gbfabrictools_version}"

    modApi ("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude (group: "net.fabricmc.fabric-api")
    }
}

java {
    withSourcesJar()
}

jar {
	from "LICENSE"
}


