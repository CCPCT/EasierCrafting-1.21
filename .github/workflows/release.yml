name: release
on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:
    inputs:
        tag_name:
          description: 'Tag for the release (e.g., v1.0.0)'
          required: true
          default: 'manual-build'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures the git log is available

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Force Download Dependencies
        run: ./gradlew downloadAssets --continue || true

      - name: Manual Rename Fix
        run: |
          find .gradle/loom-cache/remapped_mods -name "*cloth-config-fabric-*-fabric.jar" | while read -r file; do
            mv "$file" "${file%-fabric.jar}.jar"
            echo "Successfully renamed $file"
          done
        continue-on-error: true
        
      - name: Build Mod
        run: ./gradlew build

      - name: Get Commit Message
        id: commit_message
        run: |
          {
            echo "msg<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag name or manual input for the release title
          name: "${{ github.event.inputs.tag_name || github.ref_name }} for 1.21.2-8"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: ${{ steps.commit_message.outputs.msg }}
          files: build/libs/*.jar 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}