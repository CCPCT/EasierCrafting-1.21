name: release
on:
  push:
    tags:
      - 'v*' # Trigger only when pushing a tag starting with 'v'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.0.0)'
        required: true
        default: 'v2.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for commit messages

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Standard caching is disabled here to use the manual block below

      - name: Gradle & Loom Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          # Key is based on OS and build file hashes
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          # Fallback to the most recent cache available if the files changed slightly
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Mod
        run: ./gradlew build

      - name: Get Commit Message
        id: commit_message
        run: |
          # Use the manually entered tag if it exists, otherwise use the tag that triggered the push
          TARGET_REF="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Fetching message for: $TARGET_REF"
          
          {
            echo "msg<<EOF"
            git log -1 "$TARGET_REF" --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.event.inputs.tag_name || github.ref_name }} for 1.21.2-8"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: ${{ steps.commit_message.outputs.msg }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}