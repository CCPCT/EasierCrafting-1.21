name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release'
        required: true
        default: 'v2.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod
        # --no-daemon ensures the process doesn't get killed for memory leaks
        # GRADLE_OPTS gives the runner enough RAM to decompile MC from scratch
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: -Xmx4G -XX:+UseParallelGC

      - name: Get Commit Message
        id: commit_message
        run: |
          TARGET_REF="${{ github.event.inputs.tag_name || github.ref_name }}"
          {
            echo "msg<<EOF"
            git log -1 "$TARGET_REF" --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.event.inputs.tag_name || github.ref_name }} for 1.21.2-8"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: ${{ steps.commit_message.outputs.msg }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}